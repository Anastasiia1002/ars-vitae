<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARS VITAE SANCTUM — свідома косметологія у Чернівцях</title>
    <meta
      name="description"
      content="Ліцензована медична практика @alina_naichuk: ендоліфт, EMS, краніо-сакральна терапія, дерматоскопія, ендокринологія та естетичні протоколи."
    />
    <meta property="og:title" content="ARS VITAE SANCTUM — мистецтво свідомої косметології" />
    <meta
      property="og:description"
      content="Ендокринологія + дерматологія + тілесні практики = тривала краса. Чернівці, ліцензія МОЗ України."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("ars-vitae-a11y");
          if (!raw) return;
          var prefs = JSON.parse(raw);
          var root = document.documentElement;
          if (prefs.scale === 115 || prefs.scale === 130 || prefs.scale === 150) {
            root.dataset.a11yScale = String(prefs.scale);
          }
          if (prefs.contrast === "light" || prefs.contrast === "dark" || prefs.contrast === "yellow") {
            root.dataset.a11yContrast = prefs.contrast;
          }
          if (prefs.readable) root.dataset.a11yReadable = "on";
          if (prefs.links) root.dataset.a11yLinks = "on";
          if (prefs.spacing) root.dataset.a11ySpacing = "on";
          if (prefs.motion) root.dataset.a11yMotion = "off";
          if (prefs.cursor) root.dataset.a11yCursor = "large";
          if (prefs.hideImages) root.dataset.a11yImages = "off";
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
